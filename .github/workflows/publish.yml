name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bitIO/static-page-about:${{ github.ref_name }}
            ghcr.io/bitIO/static-page-about:latest
      - name: Make package public (best-effort; needs org admin on first run)
        run: gh api --method PATCH /orgs/bitIO/packages/container/static-page-about -f visibility=public
        continue-on-error: true